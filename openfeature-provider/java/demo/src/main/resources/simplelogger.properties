# Default log level
org.slf4j.simpleLogger.defaultLogLevel=info

# Show date and time in logs
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show the log level
org.slf4j.simpleLogger.showLogName=true

# Enable INFO level for GrpcWasmFlagLogger to see TelemetryData
org.slf4j.simpleLogger.log.com.spotify.confidence.GrpcWasmFlagLogger=info

# Enable INFO level for demo Main class
org.slf4j.simpleLogger.log.com.spotify.confidence.demo.Main=info
